<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🦖 暴龍倒數計時器</title>
<style>
  :root { --bg:#fff8e7; --green:#7ed957; --green-d:#3a8f3a; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"Microsoft JhengHei UI","Microsoft JhengHei",system-ui,sans-serif; color:#2f4f2f;
    padding:12px;
  }
  canvas { width:400px; max-width:100%; aspect-ratio:400/470; display:block; }
  .row { display:flex; gap:6px; align-items:center; justify-content:center; margin:5px 0; flex-wrap:wrap; }
  button {
    font:inherit; font-size:14px; padding:6px 12px; border:2px solid #9ccc7a; background:#f3ffe6;
    border-radius:10px; cursor:pointer; color:#2f4f2f;
  }
  button:hover { background:#e2f7cc; }
  button.on { background:#bfe8a0; font-weight:bold; }
  button.main { font-size:17px; font-weight:bold; background:#8be26b; border-color:#5fbf45; padding:8px 22px; }
  button.main:hover { background:#6fd14f; }
  input[type=number] {
    width:68px; font:inherit; font-size:18px; text-align:center; padding:4px;
    border:2px solid #9ccc7a; border-radius:8px; background:#fffdf5;
  }
  label { font-size:13px; cursor:pointer; user-select:none; }
  #app { display:flex; flex-direction:column; align-items:center; width:100%; }
  body:has(#app.mini) { padding:6px; min-height:0; justify-content:flex-start; }
  #app.mini .hint, #app.mini #presets, #app.mini #pip { display:none; }
  #app.mini .row { margin:3px 0; }
  #app.mini button.main { font-size:15px; padding:6px 16px; }
  .pipbtn { font-size:13px; padding:4px 12px; }
  .fbtn { font-size:12px; padding:4px 10px; border:2px solid #9ccc7a; background:#f3ffe6; border-radius:10px; cursor:pointer; color:#2f4f2f; display:inline-block; }
  .fbtn:hover { background:#e2f7cc; }
</style>
</head>
<body>
<div id="app">
<canvas id="c" width="400" height="470"></canvas>

<div class="row" id="modes">
  <button data-mode="graphic">圖形</button>
  <button data-mode="digital">數位</button>
  <button data-mode="both" class="on">並列</button>
</div>

<div class="row">
  <input type="number" id="min" min="0" max="999" value="5"> 分
  <input type="number" id="sec" min="0" max="59" value="0"> 秒
</div>

<div class="row" id="presets">
  <button data-s="60">1分</button>
  <button data-s="300">5分</button>
  <button data-s="600">10分</button>
  <button data-s="1500">25分</button>
  <button data-s="2700">45分</button>
</div>

<div class="row">
  <button class="main" id="start">▶ 開始</button>
  <button class="main" id="reset" style="background:#f3ffe6;border-color:#9ccc7a">↺ 重設</button>
</div>
<div class="row"><label><input type="checkbox" id="mute"> 靜音</label>
  <button class="pipbtn" id="pip" style="display:none">📌 小視窗（置頂）</button></div>
<div class="row hint" id="imgrow">
  <label class="fbtn">🖼 換身體圖<input type="file" accept="image/*" id="fbody" hidden></label>
  <label class="fbtn">🖼 換尾巴圖<input type="file" accept="image/*" id="ftail" hidden></label>
  <label class="fbtn">🖼 換大笑圖<input type="file" accept="image/*" id="fhappy" hidden></label>
  <button class="fbtn" id="fclear">還原</button>
</div>
<div class="row hint"><label style="color:#8a9a7a">空白鍵：開始/暫停　Esc：重設</label></div>
</div>

<script>
(() => {
  const GREEN="#7ed957", GREEN_D="#3a8f3a", BELLY="#e4f9c6", ORANGE="#ff9f43",
        DIAL_BG="#fffdf5", PIE="#d3f2bd", BG="#fff8e7";
  const W=400, H=470;
  const FONT='"Microsoft JhengHei UI","Microsoft JhengHei",sans-serif';

  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.scale(dpr, dpr);

  let curDoc = document;           // 目前顯示介面的文件（主頁面或小視窗）
  const $ = id => curDoc.getElementById(id);
  let mode="both", total=300, remaining=300, running=false, finished=false, endTime=0, finishAt=0;

  const now = () => performance.now()/1000;

  // ---------- 聲音 ----------
  let audio=null;
  function beep(freq, dur, when=0){
    if ($("mute").checked) return;
    try{
      audio = audio || new (window.AudioContext||window.webkitAudioContext)();
      const t=audio.currentTime+when, o=audio.createOscillator(), g=audio.createGain();
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function ring(){ for(let i=0;i<3;i++){ beep(880,.18,i*.7); beep(1175,.28,i*.7+.2);} }

  // ---------- 邏輯 ----------
  function readInputs(){
    const m=Math.max(0,parseInt($("min").value)||0), s=Math.max(0,parseInt($("sec").value)||0);
    return m*60+s;
  }
  function reset(){
    running=false; finished=false; total=readInputs(); remaining=total;
    $("start").textContent="▶ 開始";
  }
  function toggle(){
    if (audio && audio.state==="suspended") audio.resume();
    if (running){
      remaining=Math.max(0,endTime-now()); running=false; $("start").textContent="▶ 繼續";
    } else {
      if (finished || remaining<=0) reset();
      if (remaining<=0) return;
      endTime=now()+remaining; running=true; $("start").textContent="⏸ 暫停";
      try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
  }
  function preset(s){ $("min").value=Math.floor(s/60); $("sec").value=s%60; reset(); }

  $("start").onclick=toggle;
  $("reset").onclick=reset;
  ["min","sec"].forEach(id=>$(id).addEventListener("input",()=>{ if(!running) reset(); }));
  $("presets").addEventListener("click",e=>{ const s=e.target.dataset.s; if(s) preset(+s); });
  $("modes").addEventListener("click",e=>{
    const m=e.target.dataset.mode; if(!m) return; mode=m;
    curDoc.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  });
  function onKey(e){
    if (e.target.tagName==="INPUT" && e.target.type==="number") { if(e.key==="Enter") toggle(); return; }
    if (e.code==="Space"){ e.preventDefault(); toggle(); }
    if (e.key==="Escape") reset();
  }
  document.addEventListener("keydown", onKey);

  // ---------- 小視窗（Picture-in-Picture，永遠在最上層）----------
  let loopWin = window, loopId = 0;
  function startLoop(win){
    loopWin = win; loopId++;
    const id = loopId;
    const frame = () => { if (id !== loopId) return; step(); draw(); loopWin.requestAnimationFrame(frame); };
    loopWin.requestAnimationFrame(frame);
  }
  const pick = (id,key) => document.getElementById(id).addEventListener("change", e => {
    const f = e.target.files[0]; if (f) setImg(key, URL.createObjectURL(f), false); e.target.value = "";
  });
  pick("fbody","body"); pick("ftail","tail"); pick("fhappy","happy");
  document.getElementById("fclear").onclick = () => { for (const k of KEYS) custom[k] = false; loadDefaults(); };
  const pipBtn = document.getElementById("pip");
  if ("documentPictureInPicture" in window) {
    pipBtn.style.display = "";
    pipBtn.onclick = async () => {
      if (curDoc !== document) return;
      try {
        const pw = await documentPictureInPicture.requestWindow({ width: 330, height: 540 });
        // 複製樣式到小視窗
        for (const ss of document.styleSheets) {
          const st = pw.document.createElement("style");
          st.textContent = [...ss.cssRules].map(r => r.cssText).join("\n");
          pw.document.head.append(st);
        }
        pw.document.title = "🦖 暴龍倒數計時器";
        const app = document.getElementById("app");
        pw.document.body.append(app);
        app.classList.add("mini");
        curDoc = pw.document;
        pw.document.addEventListener("keydown", onKey);
        startLoop(pw);
        pw.addEventListener("pagehide", () => {       // 關閉小視窗時，把介面搬回主頁面
          app.classList.remove("mini");
          document.body.append(app);
          curDoc = document;
          startLoop(window);
        });
      } catch (err) { console.warn(err); }
    };
  }

  function fmt(){
    const t = remaining>0 ? Math.ceil(remaining-1e-9) : 0;
    const h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60;
    const p=n=>String(n).padStart(2,"0");
    return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
  }

  // ---------- 繪圖工具 ----------
  const rad = d => d*Math.PI/180;
  function oval(x1,y1,x2,y2,fill,stroke,lw){
    ctx.beginPath(); ctx.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,Math.PI*2);
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
  }
  // Tk 風格弧線：角度由 3 點鐘逆時針
  function tkArc(x1,y1,x2,y2,start,extent,color,lw){
    ctx.beginPath();
    ctx.ellipse((x1+x2)/2,(y1+y2)/2,(x2-x1)/2,(y2-y1)/2,0,-rad(start),-rad(start+extent),true);
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap="round"; ctx.stroke();
  }

  function drawDial(cx,cy,R,frac){
    oval(cx-R,cy-R,cx+R,cy+R,DIAL_BG,"#8bc34a",6);
    if(frac>0){
      const r=R-8;
      ctx.beginPath();
      if(frac>=0.9999){ ctx.arc(cx,cy,r,0,Math.PI*2); }
      else { ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+frac*Math.PI*2,false); ctx.closePath(); }
      ctx.fillStyle=PIE; ctx.fill();
    }
    for(let i=0;i<60;i++){
      const a=rad(i*6), big=i%5===0, r1=R-(big?22:14), r2=R-8;
      ctx.beginPath();
      ctx.moveTo(cx+r1*Math.sin(a),cy-r1*Math.cos(a));
      ctx.lineTo(cx+r2*Math.sin(a),cy-r2*Math.cos(a));
      ctx.strokeStyle=big?"#5a9a3a":"#a9cf8f"; ctx.lineWidth=big?3:1; ctx.lineCap="round"; ctx.stroke();
    }
  }

  function drawDigits(x,y,size){
    ctx.font=`bold ${size}px Consolas,"Courier New",monospace`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="#cfe9b8"; ctx.fillText(fmt(),x+2,y+2);
    ctx.fillStyle=finished?"#e0523a":"#2f6b2f"; ctx.fillText(fmt(),x,y);
  }

  // ---------- 內建圖片（可愛暴龍）＋自訂圖片 ----------

  const KEYS = ["body","tail","happy"];
  const imgs = { body:null, tail:null, happy:null };
  const custom = {};                      // 使用者自選的圖優先於內建圖
  let booting = true;                     // 圖片解碼前先不畫恐龍，避免閃一下
  setTimeout(() => { booting = false; }, 600);
  function setImg(key, src, isDefault){
    const im = new Image();
    im.onload = () => {
      if (isDefault && custom[key]) return;
      if (!isDefault) custom[key] = true;
      imgs[key] = im;
    };
    im.src = src;
  }
  function loadDefaults(){ for (const k of KEYS) setImg(k, DEF[k], true); }
  loadDefaults();
  // 若與本網頁同資料夾有 dino-body.png / dino-tail.png / dino-happy.png，會自動改用
  for (const k of KEYS) setImg(k, "dino-" + k + ".png", false);

  // ---------- 綠色暴龍 ----------
  const REX = { BODY:"#78d957", DARK:"#2f7f3a", STRIPE:"#4fb04a", BELLY:"#eafccf",
                MUZZLE:"#b4efa0", NAIL:"#fff4dc", INK:"#2b2b2b" };

  function drawTailRex(cx,cy,s,tailDeg,tailLen,wiggle,phase){
    const th=rad(tailDeg), dx=Math.sin(th), dy=-Math.cos(th), px=Math.cos(th), py=Math.sin(th);
    const pt=(t,off)=>[cx+t*dx+off*px, cy+t*dy+off*py];
    const n=16, up=[], lo=[], ce=[], wd=[];
    for(let i=0;i<=n;i++){
      const u=i/n, t=u*tailLen*s, w=(19*(1-u)+3)*s, off=wiggle*s*Math.sin(u*3.2+phase)*u;
      up.push(pt(t,off-w)); lo.push(pt(t,off+w)); ce.push(pt(t,off)); wd.push([t,off,w]);
    }
    ctx.beginPath();
    [...up, ...lo.slice().reverse()].forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.closePath(); ctx.fillStyle=REX.BODY; ctx.fill();
    ctx.strokeStyle=REX.DARK; ctx.lineWidth=3; ctx.lineJoin="round"; ctx.stroke();
    for(const u of [0.3,0.45,0.6,0.75]){   // 深綠色條紋
      const [t,off,w]=wd[Math.floor(u*n)], a=pt(t,off-w*0.8), b=pt(t,off+w*0.8);
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);
      ctx.strokeStyle=REX.STRIPE; ctx.lineWidth=4*s; ctx.lineCap="round"; ctx.stroke();
    }
    const [tx,ty]=ce[n], r=5.5*s; oval(tx-r,ty-r,tx+r,ty+r,"#ffd93d",REX.DARK,2);
  }

  function drawBodyRex(cx,cy,s,mouthOpen){
    const {BODY,DARK,STRIPE,BELLY,MUZZLE,NAIL,INK}=REX;
    // 腳
    for(const sx of [-1,1]){
      const fx=cx+sx*26*s;
      oval(fx-17*s,cy+44*s,fx+17*s,cy+66*s,BODY,DARK,3);
      for(const k of [-1,0,1]){ const x=fx+k*10*s;
        oval(x-3.5*s,cy+60*s,x+3.5*s,cy+68*s,NAIL,DARK,1.5); }
    }
    // 身體、肚子、斑點
    oval(cx-48*s,cy-20*s,cx+48*s,cy+58*s,BODY,DARK,3);
    oval(cx-30*s,cy+6*s,cx+30*s,cy+54*s,BELLY);
    for(const sx of [-1,1]){ const x=cx+sx*38*s, y=cy+30*s; oval(x-4*s,y-4*s,x+4*s,y+4*s,STRIPE); }
    // 小小的手
    for(const sx of [-1,1]){
      const ax=cx+sx*36*s, ay=cy+16*s;
      oval(ax-6*s,ay-4*s,ax+6*s,ay+11*s,BODY,DARK,2);
      for(const k of [-1,1]){
        ctx.beginPath(); ctx.moveTo(ax+k*2.5*s,ay+9*s); ctx.lineTo(ax+k*3.5*s,ay+16*s);
        ctx.strokeStyle=NAIL; ctx.lineWidth=2.5; ctx.lineCap="round"; ctx.stroke();
      }
    }
    // 頭頂圓圓的小突起
    for(const x of [-17,0,17]){ const y=cy-64*s, r=7*s;
      oval(cx+x*s-r,y-r,cx+x*s+r,y+r,STRIPE,DARK,2); }
    // 大頭 + 淺色嘴套
    oval(cx-54*s,cy-66*s,cx+54*s,cy+14*s,BODY,DARK,3);
    oval(cx-31*s,cy-22*s,cx+31*s,cy+10*s,MUZZLE);
    // 大眼睛
    for(const sx of [-1,1]){
      const ex=cx+sx*25*s, ey=cy-37*s;
      oval(ex-11*s,ey-13*s,ex+11*s,ey+13*s,"white",INK,2);
      if(finished){
        tkArc(ex-8*s,ey-6*s,ex+8*s,ey+10*s,20,140,INK,3.5);
      } else {
        oval(ex-6.5*s,ey-8*s,ex+6.5*s,ey+10*s,INK);
        oval(ex-5*s,ey-6*s,ex+1*s,ey,"white");
        oval(ex+1*s,ey+3*s,ex+4.5*s,ey+7*s,"white");
      }
      const bx=cx+sx*41*s;
      oval(bx-8*s,cy-14*s,bx+8*s,cy-2*s,"#ffb3b8");
    }
    // 鼻孔
    for(const sx of [-1,1]){ const nx=cx+sx*8*s; oval(nx-1.8*s,cy-17*s,nx+1.8*s,cy-13*s,DARK); }
    // 嘴巴與小尖牙
    const tooth=(x,y,dir)=>{
      ctx.beginPath(); ctx.moveTo(x-3*s,y); ctx.lineTo(x,y+dir*6.5*s); ctx.lineTo(x+3*s,y);
      ctx.closePath(); ctx.fillStyle="white"; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=1.3; ctx.stroke();
    };
    if(mouthOpen){
      oval(cx-15*s,cy-10*s,cx+15*s,cy+10*s,"#d94a4a",INK,2);
      oval(cx-8*s,cy+1*s,cx+8*s,cy+9*s,"#ff8d8d");
      tooth(cx-9*s,cy-9*s,1); tooth(cx+9*s,cy-9*s,1);
    } else {
      tkArc(cx-14*s,cy-14*s,cx+14*s,cy+4*s,205,130,INK,3);
      tooth(cx+9*s,cy+1*s,1);
    }
  }

  // ---- 圖片版：尾巴圖朝上、底部中央為轉軸；身體圖以中心對齊 ----
  function drawTailImg(cx,cy,s,tailDeg,tailLen,wiggle,phase){
    const im=imgs.tail, h=tailLen*s, w=h*im.width/im.height;
    ctx.save(); ctx.translate(cx,cy);
    ctx.rotate(rad(tailDeg + wiggle*1.2*Math.sin(phase)));
    ctx.drawImage(im,-w/2,-h,w,h); ctx.restore();
  }
  function drawBodyImg(im,cx,cy,s){
    const h=175*s, w=h*im.width/im.height;
    ctx.drawImage(im,cx-w/2,cy-0.58*h,w,h);   // 轉軸（尾巴根部）落在身體高度 58% 的位置
  }

  function drawDino(cx,cy,s,tailDeg,tailLen,wiggle,phase,mouthOpen){
    if (booting && !(imgs.body && imgs.tail)) return;
    if(imgs.tail) drawTailImg(cx,cy,s,tailDeg,tailLen,wiggle,phase);
    else          drawTailRex(cx,cy,s,tailDeg,tailLen,wiggle,phase);
    const bodyImg = (finished && imgs.happy) ? imgs.happy : imgs.body;   // 時間到換成大笑版
    if(bodyImg) drawBodyImg(bodyImg,cx,cy,s);
    else        drawBodyRex(cx,cy,s,mouthOpen);
  }

  // ---------- 主繪製 ----------
  function draw(){
    const t=now();
    const phase = running ? t*5 : t*2;
    const flash = finished && Math.floor(t*3)%2===0 && t-finishAt<6;
    ctx.fillStyle = flash ? "#ffe0e0" : BG;
    ctx.fillRect(0,0,W,H);

    const frac = total>0 ? Math.max(0,Math.min(1,remaining/total)) : 0;
    const bounce = finished ? Math.abs(Math.sin(t*8))*10 : 0;

    if(mode==="digital"){
      drawDino(200,150-bounce,0.9,100,120,7,phase,finished);
      drawDigits(200,330,66);
    } else {
      const cx=200, cy=195, R=168;
      drawDial(cx,cy,R,frac);
      drawDino(cx,cy-bounce,1.0,frac*360,160,running?5:2,phase,finished);
      if(mode==="both") drawDigits(200,410,46);
    }
    if(finished){
      ctx.font=`bold 18px ${FONT}`; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillStyle="#e0523a"; ctx.fillText("時間到囉！",200, mode==="digital"?400:448);
    }
  }

  function step(){
    if(running){
      remaining=endTime-now();
      if(remaining<=0){
        remaining=0; running=false; finished=true; finishAt=now();
        $("start").textContent="▶ 開始"; ring();
      }
    }
    document.title = (running||finished||remaining!==total ? fmt()+" ":"") + "🦖 暴龍倒數計時器";
  }
  reset();
  startLoop(window);
  setInterval(step, 500);   // 分頁在背景、動畫暫停時，仍能準時偵測時間到
})();
</script>
</body>
</html>
